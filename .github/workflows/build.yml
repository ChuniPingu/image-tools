name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $manifest = Get-Content build-manifest.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -ne "v$($manifest.version)") {
            throw "Tag does not match build-manifest.json."
          }
      - name: Build, test, install and package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Smoke test extracted release
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath build/artifacts/image-tools-win-x64.zip -DestinationPath build/release-smoke
          ./scripts/smoke.ps1 -BundleDirectory build/release-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-tools-win-x64
          path: |
            build/artifacts/image-tools-win-x64.zip
            build/artifacts/SHA256SUMS
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG build/artifacts/image-tools-win-x64.zip build/artifacts/SHA256SUMS --verify-tag --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
